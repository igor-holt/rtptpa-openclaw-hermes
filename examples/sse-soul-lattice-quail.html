  <script>
    // Demo client for Genesis Conductor Soul Lattice v4.0 SSE API
    // In production: connect to your /sse or Cloudflare Worker endpoint that emits evt- records
    const streamEl = document.getElementById('stream');
    streamEl.textContent = '';

    // Simulated stream (replace with real EventSource('/api/sse/quail') )
    const events = [
      { crystal_score: 0.92, spectral_gap: 0.12, thermodynamic_yield: 1.8e-12, power_tower: [0.333,0.333,0.334], control_fidelity: 0.98 },
      { crystal_score: 0.93, spectral_gap: 0.115, thermodynamic_yield: 1.8e-12, power_tower: [0.333,0.333,0.334], control_fidelity: 0.98 },
      { crystal_score: 0.94, spectral_gap: 0.11, thermodynamic_yield: 1.8e-12, power_tower: [0.333,0.333,0.334], control_fidelity: 0.98 },

      { crystal_score: 0.96, spectral_gap: 0.1, thermodynamic_yield: 1.8e-12, power_tower: [0.333,0.333,0.334], control_fidelity: 0.98 },
      { crystal_score: 0.97, spectral_gap: 0.095, thermodynamic_yield: 1.8e-12, power_tower: [0.333,0.333,0.334], control_fidelity: 0.98 }
    ];

    let i = 0;
    function push() {
      if (i >= events.length) i = 0;
      const p = events[i++];
      const div = document.createElement('div');
      div.className = 'event';
      div.innerHTML = `<span class="score">crystal=${p.crystal_score}</span>  gap=${p.spectral_gap}  thermo=${p.thermodynamic_yield}  fidelity=${p.control_fidelity}  tower=[${p.power_tower}]  · geo=Ames_QuAIL`;
      streamEl.prepend(div);
      if (streamEl.children.length > 20) streamEl.removeChild(streamEl.lastChild);
    }
    push();
    setInterval(push, 1200);
